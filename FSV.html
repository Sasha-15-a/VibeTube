    <div class="container">
        <div class="watch-wrap">
            <div class="player-box" id="playerBox">
                <iframe
                    id="watchFrame"
                    src=""
                    title="YouTube video player"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen
                    style="display: none; width: 100%; height: 100%; border: none;">
                </iframe>
                <video id="watchVideo" controls autoplay playsinline style="display: none; width: 100%; height: 100%; background: #000;"></video>
            </div>

            <div class="watch-info">
                <div>
                    <div class="watch-title" id="watchTitle">Назва відео</div>
                    <div class="channel" id="watchChannel">Канал</div>
                    <div class="meta" id="watchMeta">Перегляди</div>
                </div>
                <div class="watch-actions">
                    <button type="button" class="action-btn" onclick="goFullscreen()">На все вікно</button>
                    <a href="index.html" class="action-btn secondary" style="text-decoration: none;">Назад</a>
                </div>
            </div>

            <div class="section-heading">Інші відео</div>
            <div class="videos" id="moreVideos"></div>

            { url: "https://www.youtube.com/embed/MvgeoPYVsFU?si=GV2hAqyQENSfHPEw", title: "This Audi A6 Was Completely Submerged in a Flood… Then We Brought It Back to Life", channel: "Ігровий Куток", meta: "73 тис. переглядів • 1 тиждень тому", thumb: "pin14.png", avatar: "https://yt3.ggpht.com/PCJbHv_e8J57ZoHS2swfPOK5MMDUpXkyelO1lqRCgmPNTUralU-i8cY_rvFmE-mDsA9qCfqIuw=s88-c-k-c0x00ffffff-no-rj", time: "28:19" }
        ];

        function toEmbedUrl(url) {
            if (!url) return '';
            const trimmed = url.trim();
            if (trimmed.includes('/embed/')) {
                const sep = trimmed.includes('?') ? '&' : '?';
                return trimmed.includes('autoplay=') ? trimmed : `${trimmed}${sep}autoplay=1`;
            }
            if (trimmed.includes('v=')) {
                const id = trimmed.split('v=')[1].split('&')[0];
                return `https://www.youtube.com/embed/${id}?autoplay=1`;
            }
            if (trimmed.includes('youtu.be/')) {
                const id = trimmed.split('youtu.be/')[1].split('?')[0];
                return `https://www.youtube.com/embed/${id}?autoplay=1`;
            }
            if (trimmed.includes('/shorts/')) {
                const id = trimmed.split('/shorts/')[1].split('?')[0];
                return `https://www.youtube.com/embed/${id}?autoplay=1`;
            }
            return trimmed;
        }

        function isDirectVideoFile(url) {
            return /\.(mp4|webm|ogg)(\?.*)?$/i.test(url.trim());
        }

        function loadPlayer(url) {
            const frame = document.getElementById('watchFrame');
            const vid = document.getElementById('watchVideo');

            frame.src = '';
            frame.style.display = 'none';
            vid.pause();
            vid.removeAttribute('src');
            vid.load();
            vid.style.display = 'none';

            if (isDirectVideoFile(url)) {
                vid.src = url;
                vid.style.display = 'block';
                vid.play().catch(() => {});
            } else if (url) {
                frame.src = toEmbedUrl(url);
                frame.style.display = 'block';
            }
        }

        function saveToHistory(item) {
            let list = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            list = list.filter(x => !(x.url === item.url && x.title === item.title));
            list.unshift(item);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list.slice(0, 30)));
        }

        function setCurrentVideo(item) {
            localStorage.setItem('vibetube_current_video', JSON.stringify(item));
            document.getElementById('watchTitle').textContent = item.title;
            document.getElementById('watchChannel').textContent = item.channel;
            document.getElementById('watchMeta').textContent = item.meta;
            document.getElementById('customVideoUrl').value = item.url;
            saveToHistory(item);
            loadPlayer(item.url);
            renderMore(item);
            window.scrollTo(0, 0);
        }

        function playCustomUrl() {
            const url = document.getElementById('customVideoUrl').value.trim();
            if (!url) return;
            setCurrentVideo({
                url: url,
                title: 'Власне відео за посиланням',
                channel: 'Користувач',
                meta: url,
                thumb: 'pin1.png',
                avatar: 'https://yt3.ggpht.com/ytc/AIdro_ni4-GkOkWGEv_ZjK6ZR4CwL4V2fZ4WBx80HJ6dj9_QyA=s88-c-k-c0x00ffffff-no-rj',
                time: 'LINK'
            });
        }

        function goFullscreen() {
            const box = document.getElementById('playerBox');
            if (box.requestFullscreen) box.requestFullscreen();
            else if (box.webkitRequestFullscreen) box.webkitRequestFullscreen();
        }

        function renderMore(current) {
            const others = ALL_VIDEOS.filter(v => !(v.url === current.url && v.title === current.title));
            document.getElementById('moreVideos').innerHTML = others.map(v => `
                <div class="card" onclick='setCurrentVideo(${JSON.stringify(v).replace(/'/g, "&#39;")})'>
                    <div class="thumb">
                        <img src="${v.thumb}" alt="video">
                        <span class="time">${v.time}</span>
                    </div>
                    <div class="card-body">
                        <img class="channel-pic" src="${v.avatar}" alt="avatar">
                        <div>
                            <div class="title">${v.title}</div>
                            <div class="channel">${v.channel}</div>
                            <div class="meta">${v.meta}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        const savedVideo = JSON.parse(localStorage.getItem('vibetube_current_video') || 'null') || ALL_VIDEOS[0];
        setCurrentVideo(savedVideo);
    </script>
