<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeTube — Історія переглядів</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <div class="header">
        <a href="index.html" class="logo">Vibe<span>Tube</span></a>

        <div class="nav-links">
            <a href="index.html" class="nav-btn">Головна</a>
            <a href="History.html" class="nav-btn active">Історія переглядів</a>
        </div>

        <div class="search-box">
            <input type="text" id="historySearch" placeholder="Пошук в історії..." oninput="renderHistory()">
            <button type="button" onclick="renderHistory()">Пошук</button>
        </div>

        <div class="avatar">М</div>
    </div>

    <div class="container">
        <div class="section-heading">
            <span>Історія переглядів</span>
            <button type="button" class="action-btn secondary" onclick="clearHistory()">Очистити історію</button>
        </div>
        <div class="videos" id="historyVideos"></div>
        <div class="empty-msg" id="emptyHistory" style="display: none;">Історія поки порожня. Натисни на будь-яке відео на головній, щоб воно з'явилося тут.</div>
    </div>

    <script>
        const STORAGE_KEY = 'vibetube_history_v1';

        function openFromHistory(item) {
            localStorage.setItem('vibetube_current_video', JSON.stringify(item));
            window.location.href = 'watch.html';
        }

        function renderHistory() {
            const q = document.getElementById('historySearch').value.toLowerCase().trim();
            const list = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const filtered = list.filter(v =>
                v.title.toLowerCase().includes(q) || v.channel.toLowerCase().includes(q)
            );

            const container = document.getElementById('historyVideos');
            const emptyMsg = document.getElementById('emptyHistory');

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyMsg.style.display = 'block';
                return;
            }

            emptyMsg.style.display = 'none';
            container.innerHTML = filtered.map(v => `
                <div class="card" onclick='openFromHistory(${JSON.stringify(v).replace(/'/g, "&#39;")})'>
                    <div class="thumb">
                        <img src="${v.thumb}" alt="video">
                        <span class="time">${v.time}</span>
                    </div>
                    <div class="card-body">
                        <img class="channel-pic" src="${v.avatar}" alt="avatar">
                        <div>
                            <div class="title">${v.title}</div>
                            <div class="channel">${v.channel}</div>
                            <div class="meta">${v.meta}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function clearHistory() {
            localStorage.removeItem(STORAGE_KEY);
            renderHistory();
        }

        renderHistory();
    </script>

</body>
</html>
